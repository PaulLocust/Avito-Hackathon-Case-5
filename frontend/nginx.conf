server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: клиентские маршруты отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API на том же origin: nginx проксирует /api на бэкенд (OPENAPI, servers.url «/»).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Пробы состояния вне префикса /api.
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    location = /readyz {
        proxy_pass http://backend:8080/readyz;
    }
}
