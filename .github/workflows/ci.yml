name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Интеграционные тесты работают с настоящей PostgreSQL: миграции, CHECK
    # и частичные уникальные индексы фейками не проверить.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: antiscam
          POSTGRES_PASSWORD: antiscam
          POSTGRES_DB: antiscam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antiscam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Линтер
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          golangci-lint run --config ../.golangci.yaml ./...

      - name: Тесты
        run: go test ./... -race

      - name: Интеграционные тесты с PostgreSQL
        env:
          TEST_POSTGRES_DSN: postgres://antiscam:antiscam@localhost:5432/antiscam_test?sslmode=disable
        run: go test -tags integration ./test/... -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Генерация типов из OpenAPI
        run: npm run api-types

      - name: Линтер
        run: npm run lint

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Поднять стек
        run: docker compose up -d --build

      - name: Дождаться готовности API
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        working-directory: frontend
        run: npm ci

      - name: Установка браузера
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E ключевого пути
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 5

      - name: Логи стека при падении
        if: failure()
        run: docker compose logs
